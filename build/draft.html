<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Draft Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1E6CF; --paper-2:#E7D8B6; --paper-3:#DCC9A0;
  --ink:#2B211A; --wood:#7A4A2B; --wood-2:#5C3620; --wood-3:#4A2B18;
  --mustard:#E8A93B; --mustard-2:#A8700F;
  --pickle:#4E6E58; --pickle-2:#395243;
  --tomato:#C13B2E; --tomato-2:#9A2C21;
  --stampblue:#2E4A6B;
  --r:8px;
  --display:'Alfa Slab One',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:
    radial-gradient(ellipse at 12% 0%, rgba(122,74,43,.10), transparent 55%),
    radial-gradient(ellipse at 88% 100%, rgba(78,110,88,.10), transparent 55%),
    repeating-linear-gradient(0deg, rgba(122,74,43,.028) 0 1px, transparent 1px 3px);
  color:var(--ink);
  font-family:'Courier Prime',ui-monospace,monospace;
  font-size:16px; line-height:1.5;
  min-height:100dvh; padding:18px 12px 44px;
  display:flex; justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.wrap{width:100%;max-width:720px}
:focus-visible{outline:3px solid var(--stampblue); outline-offset:2px}

/* ---------- masthead ---------- */
.mast{text-align:center;margin-bottom:18px}
.eyebrow{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--wood-2);font-weight:700}
h1{font-family:var(--display);font-size:clamp(28px,7.5vw,44px);color:var(--tomato);
   text-shadow:2px 2px 0 var(--ink);margin:5px 0;line-height:1}
.tagline{font-size:13.5px;color:var(--wood-3);line-height:1.5}

/* ---------- generic ---------- */
.btn{
  font-family:var(--display);font-size:17px;letter-spacing:.03em;
  color:var(--paper);background:var(--tomato);border:none;border-radius:var(--r);
  padding:16px 24px;cursor:pointer;box-shadow:0 4px 0 var(--tomato-2);
  transition:transform .07s,box-shadow .07s;width:100%;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--tomato-2)}
.btn.ghost{background:var(--wood);box-shadow:0 4px 0 var(--wood-2)}
.btn.green{background:var(--pickle);box-shadow:0 4px 0 var(--pickle-2)}
.btn:disabled{background:#c4b89b;box-shadow:0 4px 0 #a3977a;color:#7d7259;cursor:not-allowed}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.btn-row{grid-template-columns:1fr}}

.hint{font-size:12.5px;color:var(--wood-3);text-align:center;margin-top:11px;line-height:1.55}
.screen{animation:rise .26s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- league select ---------- */
.leagues{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:520px){.leagues{grid-template-columns:1fr}}
.league{border:4px solid var(--wood-2);border-radius:var(--r);background:var(--paper-2);
  padding:18px 10px;text-align:center;cursor:pointer;width:100%;display:block;color:inherit;
  font-family:inherit;transition:transform .1s,background .15s,box-shadow .1s}
.league:hover,.league:focus-visible{transform:translateY(-3px);box-shadow:0 4px 0 var(--wood-2);background:var(--mustard)}
.league .em{font-size:40px;display:block;line-height:1.1}
.league .nm{font-family:var(--display);font-size:19px;margin-top:7px;display:block}
.league .sub{font-size:11.5px;color:var(--wood-3);margin-top:4px;display:block;letter-spacing:.02em}

.rules{border:3px dashed var(--wood);border-radius:var(--r);background:var(--paper-2);padding:16px 18px}
.rules h3{font-family:var(--display);font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;margin:0 0 10px;color:var(--wood-2)}
.rules ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7}
.rules li{margin-bottom:5px}
.rules b{color:var(--tomato-2);font-weight:700}
.src{margin-top:14px;font-size:12px;color:var(--wood-3);text-align:center;line-height:1.7}
.src label{border-bottom:1px dotted var(--wood);cursor:pointer;font-weight:700;color:var(--ink)}
.src input{display:none}

/* ---------- slot rail ---------- */
/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.back{font-family:'Courier Prime',monospace;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;border:3px solid var(--wood-2);border-radius:var(--r);background:var(--paper-2);
  color:var(--wood-3);padding:8px 13px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.back:hover{background:var(--paper-3)}
.back.armed{border-color:var(--tomato);background:#fff0e8;color:var(--tomato-2)}
.topbar .ctx{font-size:11.5px;color:var(--wood-3);letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;text-align:right}

.rail{display:flex;gap:5px;margin-bottom:12px}
.rail div{flex:1;border-radius:5px;background:var(--paper-3);border:2px solid var(--wood);
  font-family:var(--display);font-size:11.5px;text-align:center;padding:5px 0;color:var(--wood-3)}
.rail div.done{background:var(--pickle);border-color:var(--pickle-2);color:var(--paper)}
.rail div.now{background:var(--mustard);border-color:var(--ink);color:var(--ink)}

/* ---------- lot board: the name is the headline ---------- */
.board{
  background:var(--pickle);border:5px solid var(--wood-2);border-radius:var(--r);
  padding:34px 16px 22px;text-align:center;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.06),0 6px 0 rgba(0,0,0,.15);
}
.board .lotno,.board .round{position:absolute;top:10px;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(241,230,207,.78)}
.board .lotno{left:14px;font-family:var(--display);letter-spacing:.1em}
.board .round{right:14px}
.pos-line{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--mustard);margin-bottom:10px}
.pos-line .range{color:rgba(241,230,207,.65);letter-spacing:.1em}
.p-name{font-family:var(--display);color:var(--paper);
  font-size:clamp(27px,7.2vw,40px);line-height:1.06;text-shadow:1px 2px 0 rgba(0,0,0,.22)}
.p-team{font-size:14px;color:rgba(241,230,207,.88);margin-top:8px}
.buzz{margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(241,230,207,.75)}
.buzz.blind{margin-top:16px;font-size:11.5px;letter-spacing:.18em;color:rgba(241,230,207,.6)}
.buzz .stars{display:block;color:var(--mustard);letter-spacing:.14em;font-size:26px;margin-top:4px;
  text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.ovr-box{margin-top:14px;display:inline-flex;align-items:center;gap:12px;background:var(--paper);
  border:4px solid var(--ink);border-radius:8px;padding:10px 16px;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.ovr-num{font-family:var(--display);font-size:46px;line-height:.9}
.ovr-lab{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--wood-3);text-align:left;line-height:1.9}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:20px}

/* stamp */
.stamp-layer{display:flex;justify-content:center;margin:-22px 0 0;position:relative;z-index:3;pointer-events:none}
.stamp{font-family:var(--display);font-size:clamp(20px,5.4vw,29px);
  color:var(--tomato);border:5px solid var(--tomato);border-radius:6px;padding:10px 18px;
  background:rgba(241,230,207,.97);transform:rotate(-8deg);text-align:center;
  animation:slam .42s cubic-bezier(.2,1.5,.4,1) both}
.stamp.green{color:var(--pickle-2);border-color:var(--pickle-2)}
.stamp.blue{color:var(--stampblue);border-color:var(--stampblue)}
.stamp small{display:block;font-family:'Courier Prime',monospace;font-size:12.5px;font-weight:700;margin-top:4px}
@keyframes slam{0%{transform:rotate(-8deg) scale(2.3);opacity:0}55%{transform:rotate(-8deg) scale(.93);opacity:1}100%{transform:rotate(-8deg) scale(1);opacity:1}}

/* ---------- GM cards ---------- */
.gms{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
@media(max-width:600px){.gms{grid-template-columns:1fr}}
.gm{border:4px solid var(--wood-2);border-radius:var(--r);background:var(--paper-2);padding:14px 15px 11px}
.gm.p1{box-shadow:inset 0 0 0 3px rgba(232,169,59,.55)}
.gm.p2{box-shadow:inset 0 0 0 3px rgba(78,110,88,.5)}
.gm{transition:transform .15s,box-shadow .15s,opacity .15s}
.gm.up{border-color:var(--ink);transform:translateY(-3px)}
.gm.p1.up{background:#FBEDC8;box-shadow:0 0 0 5px var(--mustard),0 7px 0 rgba(0,0,0,.2)}
.gm.p2.up{background:#DBE6DC;box-shadow:0 0 0 5px var(--pickle),0 7px 0 rgba(0,0,0,.2)}
.gm.off{opacity:.55;filter:saturate(.55)}
.onclock{display:block;margin:-14px -15px 11px;padding:7px 6px;text-align:center;
  font-family:var(--display);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  border-radius:4px 4px 0 0}
.p1 .onclock{background:var(--mustard-2);color:#fff}
.p2 .onclock{background:var(--pickle-2);color:#fff}
.pip{display:inline-block;width:13px;height:13px;border:2px solid var(--ink);border-radius:3px;
  vertical-align:-1px;margin-right:7px;flex:none}
.p1 .pip{background:var(--mustard)} .p2 .pip{background:var(--pickle)}

/* ---------- turn banner ---------- */
.turnbar{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;
  border:4px solid var(--ink);border-radius:var(--r);padding:14px 14px;margin-bottom:12px;
  font-family:var(--display);font-size:clamp(17px,4.6vw,22px);line-height:1.2}
.turnbar.p1{background:var(--mustard);color:var(--ink)}
.turnbar.p2{background:var(--pickle);color:var(--paper)}
.turnbar.p2 .pip{border-color:var(--paper)}
.turnbar small{display:block;font-family:'Courier Prime',monospace;font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:4px}
.btn.as-p1{background:var(--mustard-2);box-shadow:0 4px 0 #7A5209}
.btn.as-p2{background:var(--pickle);box-shadow:0 4px 0 var(--pickle-2)}

/* ---------- name setup ---------- */
.names{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nameField{display:flex;align-items:center;flex:1;border:4px solid var(--wood-2);border-radius:var(--r);
  background:var(--paper-2);padding:10px 12px;min-width:0}
.nameField.p1{box-shadow:inset 0 0 0 3px rgba(232,169,59,.55)}
.nameField.p2{box-shadow:inset 0 0 0 3px rgba(78,110,88,.5)}
.nameField input{flex:1;min-width:0;border:none;background:transparent;font-family:var(--display);
  font-size:19px;color:inherit;padding:0;width:100%}
.nameField input:focus{outline:none}
.nameField.p1 input{color:var(--mustard-2)} .nameField.p2 input{color:var(--pickle-2)}
.vs{font-family:var(--display);font-size:15px;color:var(--wood-2);flex:none}
.setup-lbl{font-family:var(--display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--wood-2);text-align:center;margin-bottom:9px}
.diff{border:4px solid var(--wood-2);border-radius:var(--r);background:var(--paper-2);
  padding:12px 16px 13px;margin-bottom:16px}
.diff input[type=range]{width:100%;accent-color:var(--tomato);height:28px;margin:0;cursor:pointer}
.diff-stops{display:flex;justify-content:space-between;font-family:var(--display);font-size:12.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--wood-3)}
.diff-stops span.on{color:var(--tomato)}
.diff-note{font-size:12.5px;color:var(--wood-3);margin-top:9px;line-height:1.5;text-align:center}
.botName{font-family:var(--display);font-size:19px;color:var(--pickle-2)}

/* ---------- settings toggles ---------- */
.togs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
@media(max-width:430px){.togs{grid-template-columns:1fr}}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  border:4px solid var(--wood-2);border-radius:var(--r);background:var(--paper-2);color:inherit;
  font-family:inherit;padding:11px 13px;cursor:pointer;text-align:left;
  transition:background .12s,border-color .12s}
.tog:hover{background:var(--paper-3)}
.tog-lbl{font-family:var(--display);font-size:13px}
.tog-state{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--wood-3);border:2px solid var(--wood);border-radius:20px;padding:3px 9px;white-space:nowrap}
.tog.on{border-color:var(--pickle-2);background:#E3EBE2}
.tog.on .tog-state{color:#fff;background:var(--pickle-2);border-color:var(--pickle-2)}

/* ---------- scoreboard ---------- */
.scoreboard{border:4px solid var(--ink);border-radius:var(--r);background:var(--mustard);
  padding:13px 14px;margin-bottom:16px;text-align:center}
.sb-lbl{font-family:var(--display);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;opacity:.72}
.sb-line{font-family:var(--display);font-size:clamp(17px,4.6vw,22px);margin:6px 0 9px;line-height:1.25}
.sb-reset{font-family:'Courier Prime',monospace;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;border:2px solid var(--ink);border-radius:20px;background:transparent;
  color:var(--ink);padding:4px 12px;cursor:pointer}
.sb-reset:hover{background:var(--paper)}
.sb-strip{border:3px dashed var(--wood);border-radius:var(--r);background:var(--paper);
  padding:10px;margin-bottom:14px;font-size:13.5px;font-weight:700}
.gm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  border-bottom:3px solid var(--wood);padding-bottom:10px;margin-bottom:6px}
.gm-name{font-family:var(--display);font-size:19px;line-height:1.1}
.p1 .gm-name{color:var(--mustard-2)} .p2 .gm-name{color:var(--pickle-2)}
.gm-meta{font-size:11.5px;color:var(--wood-3);margin-top:5px}
.lead{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;background:var(--tomato);color:var(--paper);border-radius:20px;padding:3px 9px}
.gm-nums{text-align:right;flex:none}
.gm-ovr{font-family:var(--display);font-size:34px;line-height:1}
.gm-ovr .dec{font-size:21px;color:var(--wood-2)}
.gm-ovr small{display:block;font-family:'Courier Prime',monospace;font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--wood-3);margin-top:4px}
.gm-cash{font-size:19px;font-weight:700;margin-top:8px}
.roster{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;
  padding:9px 3px;border-bottom:1px dashed var(--paper-3)}
.slot:last-child{border-bottom:none}
.slot .pos{font-family:var(--display);font-size:10.5px;text-align:center;
  border:2px solid var(--wood);border-radius:4px;padding:3px 0;color:var(--wood-2);background:var(--paper)}
.slot .nm{font-size:14.5px;font-weight:700;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.slot .nm small{display:block;font-size:11px;font-weight:400;color:var(--wood-3);margin-top:3px}
.slot .ov{font-family:var(--display);font-size:18px;padding:4px 10px;border-radius:5px}
.slot.open .nm{font-weight:400;font-style:italic;color:#8a7a5e}
.slot.open .pos{color:#8a7a5e;border-color:#b5a583}
.slot.live{background:#fff7e6;border-left:4px solid var(--mustard);padding-left:7px;margin-left:-4px}
.slot.live .nm{font-style:normal;font-weight:700;color:var(--mustard-2)}
.slot.live .pos{color:var(--mustard-2);border-color:var(--mustard-2)}

/* ---------- bid pad: the readout is the whole screen ---------- */
.pad-head{text-align:center;margin-bottom:14px;border:4px solid var(--ink);border-radius:var(--r);
  padding:16px 14px}
.pad-head.p1{background:var(--mustard)}
.pad-head.p2{background:var(--pickle);color:var(--paper)}
.pad-who{font-family:var(--display);font-size:clamp(23px,6vw,29px);line-height:1.15}
.pad-sub{font-size:13.5px;margin-top:8px;line-height:1.5}
.pad-head.p1 .pad-sub{color:#6B4A08} .pad-head.p2 .pad-sub{color:rgba(241,230,207,.9)}
.pad-head.p2 .pad-sub .stars{color:var(--mustard)}
.pad-sub .stars{color:var(--mustard-2);font-size:15px;letter-spacing:.08em}
.readout{border:4px solid var(--wood-2);border-radius:var(--r);background:var(--ink);color:var(--mustard);
  text-align:center;padding:16px 10px 18px;margin-bottom:12px;font-family:var(--display);
  font-size:60px;line-height:1}
.readout .cap{display:block;font-family:'Courier Prime',monospace;font-size:11.5px;
  color:rgba(241,230,207,.75);letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.key{font-family:var(--display);font-size:25px;padding:16px 0;border:3px solid var(--wood-2);
  border-radius:var(--r);background:var(--paper-2);color:inherit;cursor:pointer;transition:transform .06s,background .12s}
.key:active{transform:translateY(2px);background:var(--mustard)}
.key.alt{font-size:15px;background:var(--paper-3)}

/* ---------- reserve plaque ---------- */
.reserve{border:4px solid var(--stampblue);border-radius:var(--r);background:#e6ddc9;
  text-align:center;padding:16px 16px 14px;margin:14px 0}
.reserve .lbl{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--stampblue)}
.reserve .fig{font-family:var(--display);font-size:clamp(44px,12vw,58px);line-height:1;margin:6px 0 8px;
  color:var(--stampblue)}
.reserve .sub{font-size:13.5px;line-height:1.6;max-width:44ch;margin:0 auto}
.reserve .sub b{color:var(--tomato-2)}

/* ---------- curtain ---------- */
.curtain{border:5px solid var(--ink);border-radius:var(--r);background:var(--mustard);
  text-align:center;padding:46px 18px;cursor:pointer}
.curtain.p1{background:var(--mustard)}
.curtain.p2{background:var(--pickle);color:var(--paper)}
.curtain.p2 .sm{color:rgba(241,230,207,.88)}
.curtain .big{font-family:var(--display);font-size:clamp(24px,6.6vw,34px);line-height:1.2}
.curtain .sm{font-size:13.5px;margin-top:10px;color:var(--wood-3)}
.curtain .tap{margin-top:18px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}

/* ---------- reveal ---------- */
.tickets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tk{border:3px solid var(--wood-2);border-radius:var(--r);background:var(--paper-2);padding:12px;text-align:center}
.tk.p1{border-top:9px solid var(--mustard)} .tk.p2{border-top:9px solid var(--pickle)}
.tk .who{display:flex;align-items:center;justify-content:center}
.tk.win{border-color:var(--tomato);background:#fff5e4;box-shadow:0 0 0 2px var(--tomato) inset}
.tk .who{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--wood-3);font-weight:700}
.tk .amt{font-family:var(--display);font-size:38px;margin-top:4px;line-height:1}
.tk .note{font-size:11.5px;color:var(--wood-3);margin-top:4px}
.tk.win .note{color:var(--tomato-2);font-weight:700}
.outcome{border:3px solid var(--wood-2);border-radius:var(--r);background:var(--paper-2);
  padding:14px 15px;font-size:14.5px;line-height:1.6;margin-bottom:14px}
.outcome b{color:var(--tomato-2)}
.signing{display:flex;justify-content:space-between;gap:10px;align-items:center;
  border-top:1px dashed var(--wood);padding-top:9px;margin-top:9px;font-size:14px}
.signing .l{font-weight:700}
.signing .ov{font-family:var(--display);font-size:15px;padding:3px 9px;border-radius:5px;margin-left:3px}

/* ---------- log ---------- */
.log-wrap{margin-top:16px}
.log-title{font-family:var(--display);font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--wood-2);text-align:center;margin-bottom:8px}
.log{display:flex;flex-direction:column;gap:7px;max-height:160px;overflow-y:auto;padding:11px 13px;

function buildPool(sportKey){
  const raw = POOLS[sportKey], out = {};
  for(const pos in raw){
    const list = raw[pos].slice().sort((a,b)=>b[2]-a[2]);
    out[pos] = list.map((r,i)=>({ name:r[0], team:r[1], ovr:r[2], pos,
      rank:i, pct:i/list.length, tier:tierOf(i/list.length) }));
  }
  return out;
}

/* Names already shown stay off the board for a while — this survives "run it back",
   so back-to-back drafts don't keep serving the same handful of stars. Capped at 40%
   of each pool so there's always a deep pile of eligible names left. */
const RECENT = {};
const recentKey = pos => S.sportKey + '|' + pos;
function remember(pos, name){
  /* scaled to the window this difficulty draws from — on Easy the window is small,
     so a pool-sized memory would exhaust it and start leaking in unknown players */
  const k = recentKey(pos), cap = Math.max(3, Math.floor(S.pool[pos].length * DIFFS[DIFF].lot[1] * .4));
  const q = RECENT[k] || (RECENT[k] = []);
  q.push(name);
  while(q.length > cap) q.shift();
}
function take(pos, p){ S.used.add(p.name); remember(pos, p.name); return p; }

/* Builds the list of names actually eligible right now, then picks across it.
   exp > 1 tilts toward the top of the window; exp = 1 is flat. */
function pick(pos, from, to, exp){
  const list = S.pool[pos], n = list.length;
  const lo = Math.floor(n * from), hi = Math.max(lo + 1, Math.floor(n * to));
  const recent = RECENT[recentKey(pos)] || [];
  let cand = [];
  for(let i = lo; i < hi; i++){
    const p = list[i];
    if(!S.used.has(p.name) && recent.indexOf(p.name) < 0) cand.push(i);
  }
  if(!cand.length) for(let i = lo; i < hi; i++) if(!S.used.has(list[i].name)) cand.push(i);
  if(!cand.length) for(let i = 0; i < n; i++) if(!S.used.has(list[i].name)) cand.push(i);
  if(!cand.length) return take(pos, list[0]);
  const r = exp === 1 ? Math.random() : Math.pow(Math.random(), exp);
  return take(pos, list[cand[Math.min(cand.length - 1, Math.floor(cand.length * r))]]);
}

const drawLot    = pos => pick(pos, DIFFS[DIFF].lot[0], DIFFS[DIFF].lot[1], DIFFS[DIFF].lot[2]);
const drawWaiver = pos => pick(pos, DIFFS[DIFF].waiver[0], DIFFS[DIFF].waiver[1], 1);

/* When both GMs get a name out of the same deal, the two have to be comparable —
   a coin flip between a 91 and an 82 isn't a coin flip. Pulls a random unused
   player within SPLIT_TOL of the target, or the closest one left if none qualify. */
/* A walk should cost a predictable tier, not a random cliff. Without this the loser
   could take a 55 against a 95 and the draft is over on one slot. Lands WALK_GAP below
   the name that just sold, clamped to whatever the pool actually has. */
function drawWalk(pos, signedOvr){
  const list = S.pool[pos];
  const recent = RECENT[recentKey(pos)] || [];
  const free = list.filter(p => !S.used.has(p.name));
  if(!free.length) return drawWaiver(pos);
  const hi = signedOvr - WALK_GAP[0], lo = signedOvr - WALK_GAP[1];
  const roll = bag => {
    const fresh = bag.filter(p => recent.indexOf(p.name) < 0);
    const use = fresh.length ? fresh : bag;
    return take(pos, use[Math.random() * use.length | 0]);
  };
  const band = free.filter(p => p.ovr <= hi && p.ovr >= lo);
  if(band.length) return roll(band);
  /* Pool can't drop that far — soccer only spans 80-91. Take the best name that
     still clears the penalty, and if even that's impossible, the worst one left. */
  const under = free.filter(p => p.ovr <= hi);
  if(under.length){
    const best = Math.max(...under.map(p => p.ovr));
    return roll(under.filter(p => p.ovr === best));
  }
  const worst = Math.min(...free.map(p => p.ovr));
  return roll(free.filter(p => p.ovr === worst));
}

/* What a walk is likely to fetch, so the choice is informed rather than blind. */
function walkRange(pos, signedOvr){
  const free = S.pool[pos].filter(p => !S.used.has(p.name));
  const hi = signedOvr - WALK_GAP[0];
  const band = free.filter(p => p.ovr <= hi && p.ovr >= signedOvr - WALK_GAP[1]);
  if(band.length){ const o = band.map(p => p.ovr); return [Math.min(...o), Math.max(...o)]; }
  const under = free.filter(p => p.ovr <= hi);
  const v = under.length ? Math.max(...under.map(p => p.ovr)) : Math.min(...free.map(p => p.ovr));
  return [v, v];
}

  const recent = RECENT[recentKey(pos)] || [];
  const free = list.filter(p => !S.used.has(p.name));
  if(!free.length) return drawLot(pos);
  const near = free.filter(p => Math.abs(p.ovr - target) <= (tol || SPLIT_TOL));
  if(near.length){
    /* tolerance outranks freshness — a fair pairing matters more than a new face —
       but stay inside the difficulty's window when it can be done */
    const cut = list.length * DIFFS[DIFF].lot[1];
    const known = near.filter(p => p.rank < cut);
    const scope = known.length ? known : near;
    const fresh = scope.filter(p => recent.indexOf(p.name) < 0);
    const bag = fresh.length ? fresh : scope;
    return take(pos, bag[Math.random() * bag.length | 0]);
  }
  return take(pos, free.reduce((x,y) => Math.abs(y.ovr - target) < Math.abs(x.ovr - target) ? y : x));
}

/* Public scouting buzz — honest-ish, occasionally wrong. */
function buzzOf(p){
  const honest = Math.max(1, Math.ceil((1-p.pct)*5));
  const noisy = Math.round(honest + (Math.random()-.5)*1.7);
  return Math.max(1, Math.min(5, noisy));
}
function buzzTag(p, buzz){
  const honest = Math.max(1, Math.ceil((1-p.pct)*5));
  if(honest - buzz >= 1) return {txt:'Sleeper', cls:'t-A'};
  if(buzz - honest >= 1) return {txt:'Overhyped', cls:'t-C'};
  return null;
}

/* ============================================================
   SOUND — synthesised, no files. Context is created on the first
   click because browsers refuse to start audio without a gesture.
   ============================================================ */
let AC = null;
function actx(){
  if(!OPT.sound) return null;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq, dur, type, vol, delay){
  const c = actx(); if(!c) return;
  const t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol || .18, t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol){
  const c = actx(); if(!c) return;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const src = c.createBufferSource(), g = c.createGain();
  src.buffer = buf; g.gain.value = vol || .18;
  src.connect(g); g.connect(c.destination); src.start();
}
const SFX = {
  tick:  () => tone(880, .04, 'square', .06),
  lock:  () => { tone(300, .1, 'square', .12); tone(150, .18, 'sine', .14, .04); },
  gavel: () => { noise(.14, .22); tone(110, .3, 'sine', .3, .01); tone(70, .4, 'sine', .22, .03); },
  walk:  () => { tone(260, .12, 'triangle', .12); tone(180, .22, 'triangle', .1, .1); },
  win:   () => [0,.11,.22,.36].forEach((d,i) => tone([392,494,587,784][i], .3, 'triangle', .16, d)),
};
const sfx = k => { if(OPT.sound && SFX[k]) try{ SFX[k](); }catch(e){} };

/* ============================================================
   GAME SETUP
   ============================================================ */
function startDraft(sportKey){
  const sport = SPORTS[sportKey];
  const slots = [];
  sport.slots.forEach(s => { for(let i=0;i<s.n;i++) slots.push({pos:s.pos}); });
  S = {
    sportKey, sport,
    pool: buildPool(sportKey),
    used: new Set(),
    slots: shuffle(slots),
    si: 0, round: 1, lotNo: 0,
    phase: 'lot',
    lot: null, bids:{p1:null,p2:null}, bidder:null, first:'p1',
    eligible: ['p1','p2'], reserve: 0, result: null, pending: null, sold: null,
    gm:{ p1:{name:NAMES.p1 || DEFAULTS.p1, cash:CASH, signed:[]},
         p2:{name:OPT.solo ? BOT_NAME : (NAMES.p2 || DEFAULTS.p2), cash:CASH, signed:[]} },
    log: [], scored: false,
  };
  $('tagline').textContent = `${sport.label} board · ${DIFFS[DIFF].label} · ${sport.src}. Ratings stay hidden until the gavel drops.`;
  openLot();
}

function openLot(){
  const pos = S.slots[S.si].pos;
  S.lotNo++;
  S.lot = drawLot(pos);
  S.lot.buzz = buzzOf(S.lot);
  S.bids = {p1:null,p2:null};
  S.first = OPT.solo ? 'p1' : (Math.random() < .5 ? 'p1' : 'p2');
  S.phase = 'lot';
  render();
}

const totalOvr = k => S.gm[k].signed.reduce((s,x)=> s + (x ? x.player.ovr : 0), 0);
const slotsLeft = k => 5 - S.gm[k].signed.filter(Boolean).length;

/* The bot reads exactly what a human reads — buzz stars when they're shown,
   nothing but the budget on Hard. It never sees the hidden rating. */
function botBid(k){
  const g = S.gm[k];
  const base = g.cash / Math.max(1, slotsLeft(k));
  const read = scouted() ? .45 + .28 * S.lot.buzz : .9 + Math.random() * .4;
  return Math.max(0, Math.min(g.cash, Math.round(base * read * (.85 + Math.random() * .35))));
}
function botMatch(){
  const k = S.eligible[0], g = S.gm[k];
  if(g.cash < S.reserve) return false;
  if(S.reserve <= FLOOR) return true;
  /* Everything below is public by now: the sold player's rating was revealed at the
     gavel, the reserve is on screen, and the walk range is printed for the human too.
     The bot still never sees the hidden rating of the name it's being offered. */
  const wr = walkRange(S.slots[S.si].pos, S.sold.ovr);
  const gain = (S.sold.ovr - 1) - (wr[0] + wr[1]) / 2;      // offer sits within MATCH_SPREAD
  const perSlot = g.cash / Math.max(1, slotsLeft(k));
  const strain = S.reserve / Math.max(1, perSlot);           // slot-budgets this costs
  return gain >= 3 * strain;
}

const avgOvr = k => {
  const n = S.gm[k].signed.filter(Boolean).length;
  return n ? totalOvr(k)/n : 0;
};
/* 5 players divide cleanly, so one decimal is exact rather than rounded */
const fmtAvg = v => v ? v.toFixed(1) : '0.0';
const bigAvg = v => { const [a,b] = fmtAvg(v).split('.'); return `${a}<span class="dec">.${b}</span>`; };

/* ============================================================
   ROUND 1 — sealed bids
   ============================================================ */
function lockBid(val){
  sfx('lock');
  S.bids[S.bidder] = val;
  let waiting = S.eligible.find(k => S.bids[k] === null);
  while(waiting && isBot(waiting)){            // no handoff screen for the computer
    S.bids[waiting] = botBid(waiting);
    waiting = S.eligible.find(k => S.bids[k] === null);
  }
  if(waiting){ S.phase = 'handoff'; render(); }
  else resolveRound1();
}

function sign(k, player, price, via){
  S.gm[k].cash -= price;
  S.gm[k].signed[S.si] = { player, price, via };
}

function resolveRound1(){
  const b1 = S.bids.p1 || 0, b2 = S.bids.p2 || 0;
  const pos = S.slots[S.si].pos;

  if(b1 === 0 && b2 === 0){
    const w1 = drawWaiver(pos), w2 = drawNear(pos, w1.ovr);
    sign('p1', w1, 0, 'waiver'); sign('p2', w2, 0, 'waiver');
    S.result = { type:'nobody', signings:[['p1',w1,0],['p2',w2,0]] };
    sfx('walk');
    S.log.push({ lot:S.lot, line:'no interest — both to waivers' });
  } else if(b1 === b2){
    const second = drawNear(pos, S.lot.ovr);
    second.buzz = buzzOf(second);
    const order = Math.random() < .5 ? ['p1','p2'] : ['p2','p1'];
    sign(order[0], S.lot, b1, 'split');
    sign(order[1], second, b2, 'split');
    S.result = { type:'split', price:b1, second,
      signings:[[order[0], S.lot, b1],[order[1], second, b2]] };
    sfx('gavel');
    S.log.push({ lot:S.lot, line:`split decision — both paid $${b1}` });
  } else {
    const win = b1 > b2 ? 'p1' : 'p2', price = Math.max(b1,b2);
    sign(win, S.lot, price, 'won');
    const loser = other(win);
    S.reserve = Math.max(FLOOR, price);
    S.sold = S.lot;
    S.result = { type:'sold', win, price, loser, signings:[[win, S.lot, price]] };
    S.pending = { loser, reserve:S.reserve };
    sfx('gavel');
    S.log.push({ lot:S.lot, line:`${S.gm[win].name} — $${price}` });
  }
  S.phase = 'reveal';
  render();
}

/* ============================================================
   ROUND 2 — the match clause
   ============================================================ */
function openMatch(){
  const { loser, reserve } = S.pending;
  S.pending = null;
  S.round = 2; S.lotNo++;
  S.eligible = [loser];
  /* the reserve is priced off the name that just sold, so the offer has to be in the
     same neighbourhood — otherwise the clause punishes the loser for a bad roll */
  S.lot = drawNear(S.slots[S.si].pos, S.sold.ovr, MATCH_SPREAD);
  S.lot.buzz = buzzOf(S.lot);
  S.reserve = reserve;
  if(isBot(loser)) return resolveMatch(botMatch());
  S.phase = S.gm[loser].cash < reserve ? 'nomatch' : 'match';
  render();
}

function resolveMatch(matched){
  const k = S.eligible[0], pos = S.slots[S.si].pos;
  if(matched){
    sign(k, S.lot, S.reserve, 'matched');
    S.result = { type:'matched', k, price:S.reserve, signings:[[k, S.lot, S.reserve]] };
    sfx('gavel');
    S.log.push({ lot:S.lot, line:`${S.gm[k].name} matched — $${S.reserve}` });
  } else {
    const w = S.sold ? drawWalk(pos, S.sold.ovr) : drawWaiver(pos);
    sign(k, w, 0, 'waiver');
    S.result = { type:'walked', k, signings:[[k, w, 0]] };
    sfx('walk');
    S.log.push({ lot:S.lot, line:`${S.gm[k].name} walked — waiver pickup` });
  }
  S.phase = 'reveal';
  render();
}

function advance(){
  if(S.pending){ openMatch(); return; }
  S.si++; S.round = 1; S.eligible = ['p1','p2']; S.result = null; S.sold = null;
  if(S.si >= S.slots.length){ S.phase = 'end'; scoreSeries(); sfx('win'); render(); }
  else openLot();
}

function winnerOf(){
  const a1 = avgOvr('p1'), a2 = avgOvr('p2');
  if(a1 !== a2) return a1 > a2 ? 'p1' : 'p2';
  if(S.gm.p1.cash !== S.gm.p2.cash) return S.gm.p1.cash > S.gm.p2.cash ? 'p1' : 'p2';
  return null;
}
function scoreSeries(){
  if(S.scored) return;
  S.scored = true;
  const w = winnerOf();
  SERIES.n++;
  if(w) SERIES[w]++;
}
function seriesLine(){
  if(!SERIES.n) return '';
  const n1 = OPT.solo ? (NAMES.p1 || DEFAULTS.p1) : (NAMES.p1 || DEFAULTS.p1);
  const n2 = OPT.solo ? BOT_NAME : (NAMES.p2 || DEFAULTS.p2);
  const draws = SERIES.n - SERIES.p1 - SERIES.p2;
  return `${esc(n1)} ${SERIES.p1} — ${SERIES.p2} ${esc(n2)}${draws ? ` · ${draws} drawn` : ''}`;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  armedBack = false;
  if(!S){ app.innerHTML = leagueScreen(); return; }
  const v = { lot:lotScreen, bid:bidScreen, handoff:handoffScreen,
              reveal:revealScreen, match:matchScreen, nomatch:matchScreen, end:endScreen };
  app.innerHTML = `<div class="screen">${topbar()}${v[S.phase]()}</div>`;
  if(S.phase === 'bid') syncPad();
}

/* Quitting mid-draft throws the board away, so the button arms on the first tap */

function topbar(){

    <button class="back" data-go="back">&lsaquo; Lobby</button>
    <span class="ctx">${esc(S.sport.label)} · ${DIFFS[DIFF].label} · slot ${S.si + 1}/5</span>
  </div>`;
}

function goHome(){
  S = null;
  $('tagline').textContent = 'Sealed bids. Real ratings. No lowballing.';
  render();
}

/* ---------- match clause ---------- */
function matchScreen(){
  const k = S.eligible[0], g = S.gm[k], broke = S.phase === 'nomatch';
  const wr = walkRange(S.slots[S.si].pos, S.sold.ovr);
  const walkTxt = wr[0] === wr[1] ? `${wr[0]} overall` : `${wr[0]}–${wr[1]} overall`;
  return `
    ${railHTML()}
    ${boardHTML()}
    ${turnbar(k, broke ? 'forced walk' : 'match it or walk')}
    <div class="reserve">
      <div class="lbl">Match clause · reserve</div>
      <div class="fig">$${S.reserve}</div>
      <div class="sub">${esc(S.gm[other(k)].name)} filled this slot for $${S.reserve}.
        <b>${esc(g.name)}</b> signs ${esc(S.lot.name)} for exactly that, or walks to the waiver wire
        and takes whoever's left.${broke ? ` Only <b>$${g.cash}</b> on hand — forced walk.` : ''}</div>
    </div>
    ${gmsHTML(k)}
    ${broke
      ? `<button class="btn ghost" data-go="walk">Take the waiver pickup</button>`
      : `<div class="btn-row">
           <button class="btn green" data-go="match">Match $${S.reserve}</button>
           <button class="btn ghost" data-go="walk">Walk to waivers</button>
         </div>`}
    <div class="hint">A walk lands around ${walkTxt}.${broke ? '' : ` Matching leaves ${esc(g.name)} $${g.cash - S.reserve} for the rest of the board.`}</div>
    ${logHTML()}`;
}

/* ---------- reveal ---------- */
function revealScreen(){
  const r = S.result;
  let stamp, head;
  if(r.type === 'sold'){ stamp = {top:'SOLD!', sub:`${S.gm[r.win].name} · $${r.price}`, cls:'green'}; }
  else if(r.type === 'split'){ stamp = {top:'SPLIT!', sub:`both paid $${r.price}`, cls:'blue'}; }
  else if(r.type === 'nobody'){ stamp = {top:'NO INTEREST', sub:'both to waivers'}; }
  else if(r.type === 'matched'){ stamp = {top:'MATCHED', sub:`${S.gm[r.k].name} · $${r.price}`, cls:'green'}; }
  else { stamp = {top:'WALKED', sub:'waiver wire'}; }

  if(r.type === 'sold') head = `<b>${esc(S.gm[r.win].name)}</b> takes ${esc(S.lot.name)} at $${r.price}. ${esc(S.gm[r.loser].name)} now faces a $${Math.max(FLOOR,r.price)} reserve on the next one.`;
  else if(r.type === 'split') head = `Dead heat at $${r.price}. A second ${esc(S.sport.posLabel[S.lot.pos].toLowerCase())} hit the board within ${SPLIT_TOL} overall of the first, and the two were dealt at random — both slots filled.`;
  else if(r.type === 'nobody') head = `Nobody bid. Both GMs fill the slot off the waiver wire for free.`;
  else if(r.type === 'matched') head = `<b>${esc(S.gm[r.k].name)}</b> pays the clause and signs ${esc(S.lot.name)}.`;
  else head = `<b>${esc(S.gm[r.k].name)}</b> walks. Slot filled off the scrap heap — cash kept.`;

  const showTickets = r.type === 'sold' || r.type === 'split' || r.type === 'nobody';
  const last = S.si === S.slots.length - 1 && !S.pending;

  return `
    ${railHTML()}
    ${boardHTML({reveal:true, stamp})}
    ${showTickets ? `<div class="tickets">${['p1','p2'].map(k=>{
      const b = S.bids[k] || 0;
      const won = r.type === 'sold' && r.win === k;
      return `<div class="tk ${k} ${won?'win':''}">
        <div class="who"><span class="pip"></span>${esc(S.gm[k].name)}</div>
        <div class="amt">$${b}</div>
        <div class="note">${won ? 'winning bid' : r.type === 'split' ? 'paid' : b === 0 ? 'passed' : 'no charge'}</div>
      </div>`;}).join('')}</div>` : ''}
    <div class="outcome">${head}
      ${r.signings.map(([k,p,price])=>`
        <div class="signing">
          <span class="l">${esc(S.gm[k].name)}</span>
          <span>${esc(p.name)} <span class="ov t-${p.tier}">${p.ovr}</span> · $${price}</span>
        </div>`).join('')}
    </div>
    ${gmsHTML()}
    <button class="btn" data-go="next">${S.pending ? 'On to the match clause' : last ? 'Close the books' : 'Next slot'}</button>
    ${logHTML()}`;
}

/* ---------- log ---------- */
function logHTML(){
  return `<div class="log-wrap">
    <div class="log-title">Draft log</div>
    <div class="log">${S.log.length ? S.log.slice().reverse().map(e=>
      `<div class="log-row"><span>${esc(e.lot.name)}</span><span class="r">${esc(e.line)}</span></div>`).join('')
      : '<div class="log-empty">Board is fresh — first lot is up.</div>'}</div>
  </div>`;
}

/* ---------- end ---------- */
function endScreen(){
  const a1 = avgOvr('p1'), a2 = avgOvr('p2');
  const onCash = a1 === a2 && S.gm.p1.cash !== S.gm.p2.cash;
  const win = a1 !== a2 ? (a1 > a2 ? 'p1' : 'p2')
            : onCash ? (S.gm.p1.cash > S.gm.p2.cash ? 'p1' : 'p2') : null;
  const margin = a1 !== a2 ? `by ${fmtAvg(Math.abs(a1 - a2))} average overall`
               : onCash ? `level on ratings — takes it with $${S.gm[win].cash} left over`
               : `${fmtAvg(a1)} apiece and the same cash left`;

  const rows = S.slots.map((s,i)=>{
    const a = S.gm.p1.signed[i], b = S.gm.p2.signed[i];
    const aw = a.player.ovr > b.player.ovr, bw = b.player.ovr > a.player.ovr;
    const cell = (x,side,won,lost) => `<div class="slotcell ${side} ${won?'won':''} ${lost?'beat':''}">
        <span class="n">${esc(x.player.name)} <b>${x.player.ovr}</b></span>
        <span class="m">$${x.price}${x.via==='waiver'?' · waiver':x.via==='split'?' · split':x.via==='matched'?' · matched':''}</span>
      </div>`;
    return `<div class="h2h-row">
      ${cell(a,'',aw,bw)}
      <div class="badge">${s.pos}</div>
      ${cell(b,'r',bw,aw)}
    </div>`;
  }).join('');

  return `
    <div class="end">
      <h2>Books are closed</h2>
      <div class="crown ${win || 'tie'}">
        <div class="crown-lbl">${win ? 'Winner' : 'Dead heat'}</div>
        <div class="crown-name">${win ? esc(S.gm[win].name) : 'Split the trophy'}</div>
        <div class="crown-score">${fmtAvg(Math.max(a1,a2))} <span class="lo">to ${fmtAvg(Math.min(a1,a2))}</span></div>
        <div class="crown-margin">${margin}</div>
      </div>
      ${OPT.series && SERIES.n ? `<div class="sb-strip">Series · ${seriesLine()}</div>` : ''}
      <div class="h2h">
        <div class="h2h-row head">
          <div class="p1"><span class="pip"></span>${esc(S.gm.p1.name)}</div>
          <div class="badge">SLOT</div>
          <div class="p2" style="text-align:right">${esc(S.gm.p2.name)}<span class="pip" style="margin:0 0 0 7px"></span></div>
        </div>
        ${rows}
        <div class="h2h-row tot">
          <div>${fmtAvg(a1)} avg<span class="m"> · ${totalOvr('p1')} total · $${S.gm.p1.cash} left</span></div>
          <div class="badge">AVG</div>
          <div style="text-align:right">${fmtAvg(a2)} avg<span class="m"> · ${totalOvr('p2')} total · $${S.gm.p2.cash} left</span></div>
        </div>
      </div>
      <div class="end-btns">
        <button class="btn green" data-go="again">Run it back</button>
        <button class="btn ghost" data-go="home">Change setup</button>
      </div>
    </div>`;
}

/* ============================================================
   EVENTS — one delegated listener for the whole app
   ============================================================ */
app.addEventListener('click', e => {
  const key = e.target.closest('[data-key]');
  if(key){ padPress(key.dataset.key); return; }
  const tog = e.target.closest('[data-tog]');
  if(tog){
    const k = tog.dataset.tog;
    OPT[k] = !OPT[k];
    if(k === 'solo'){ SERIES.p1 = SERIES.p2 = SERIES.n = 0; }   // different opponent, fresh record
    if(k === 'sound' && OPT.sound) sfx('tick');
    render();
    return;
  }
  const el = e.target.closest('[data-go]');
  if(!el) return;
  const go = el.dataset.go;
  if(go === 'league')  startDraft(el.dataset.k);
  else if(go === 'bid'){ S.bidder = el.dataset.k; padVal = ''; S.phase = 'bid'; render(); }
  else if(go === 'lock'){ lockBid(padVal === '' ? 0 : +padVal); }
  else if(go === 'match') resolveMatch(true);
  else if(go === 'walk')  resolveMatch(false);
  else if(go === 'next')  advance();
  else if(go === 'again') startDraft(S.sportKey);
  else if(go === 'home') goHome();
  else if(go === 'resetSeries'){ SERIES.p1 = SERIES.p2 = SERIES.n = 0; render(); }
  else if(go === 'back'){
    if(armedBack) goHome();
    else { armedBack = true; el.classList.add('armed'); el.textContent = 'Tap again to quit'; }
  }
});

document.addEventListener('keydown', e => {
  if(S && S.phase === 'bid' && !e.target.closest('.back')){
    if(/^\d$/.test(e.key)){ padPress(e.key); e.preventDefault(); }
    else if(e.key === 'Backspace'){ padPress('del'); e.preventDefault(); }
    else if(e.key === 'Enter'){ lockBid(padVal === '' ? 0 : +padVal); e.preventDefault(); }
  } else if(e.key === 'Enter' && e.target.closest('.curtain')){
    e.target.click();
  }
});

app.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'n1' || t.id === 'n2'){ NAMES[t.id === 'n1' ? 'p1' : 'p2'] = t.value.trim().slice(0,12); return; }
  if(t.id === 'diff'){
    DIFF = +t.value;
    const n = $('diffNote'); if(n) n.textContent = DIFFS[DIFF].note;
    document.querySelectorAll('.diff-stops span').forEach((el,i) => el.classList.toggle('on', i === DIFF));
  }
});

app.addEventListener('change', e => {
  if(e.target.id === 'xlsx' && e.target.files[0]) loadWorkbookFile(e.target.files[0]);
});

/* ============================================================
   SPREADSHEET LOADING
   Sheet name → league + position. Works with the original file
   or any workbook that keeps the same sheet naming.
   ============================================================ */
function mapSheet(name){
  const n = name.toLowerCase();
  if(n.includes('backcourt')) return ['nba','G'];
  if(n.includes('frontcourt')) return ['nba','FC'];
  const league = n.includes('madden') ? 'nfl' : (n.includes('fc') || n.includes('fifa')) ? 'soccer' : null;
  if(!league) return null;
  const tail = n.split('-').pop().trim();
  const pos = tail.toUpperCase().replace(/[^A-Z]/g,'');
  const valid = { nfl:['QB','RB','WR','TE'], soccer:['GK','DEF','MID','FWD'] }[league];
  return valid.includes(pos) ? [league,pos] : null;
}

function parseWorkbook(wb){
  const next = { nfl:{...POOLS.nfl}, nba:{...POOLS.nba}, soccer:{...POOLS.soccer} };
  let count = 0, sheets = 0;
  wb.SheetNames.forEach(sn => {
    const target = mapSheet(sn);
    if(!target) return;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, blankrows:false});
    if(!rows.length) return;
    const head = rows[0].map(h => String(h||'').toLowerCase());
    const iName = head.findIndex(h => h.includes('player') || h.includes('name'));
    const iTeam = head.findIndex(h => h.includes('team') || h.includes('club'));
    const iOvr  = head.findIndex(h => h.includes('ovr') || h.includes('overall') || h.includes('rating'));
    if(iName < 0 || iOvr < 0) return;
    const out = [];
    for(let r = 1; r < rows.length; r++){
      const row = rows[r]; if(!row) continue;
      const nm = row[iName], ov = Number(row[iOvr]);
      if(!nm || !isFinite(ov)) continue;
      out.push([String(nm).trim(), String(iTeam >= 0 ? row[iTeam] || '' : '').trim(), Math.round(ov)]);
    }
    if(out.length >= 12){ next[target[0]][target[1]] = out; count += out.length; sheets++; }
  });
  if(!sheets) return null;
  POOLS = next;
  return count;
}

function loadWorkbookFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const n = parseWorkbook(XLSX.read(fr.result, {type:'array'}));
      poolNote = n ? `loaded ${n} players from ${file.name}` : `couldn't read ${file.name} — kept the built-in board`;
    }catch(err){ poolNote = `couldn't read ${file.name} — kept the built-in board`; }
    render();
  };
  fr.readAsArrayBuffer(file);
}

/* If this file is served next to the spreadsheet, pick it up automatically.
   Opening straight off the disk (file://) blocks that — the built-in board covers it. */
(function autoLoad(){
  if(location.protocol === 'file:' || typeof XLSX === 'undefined') return;
  fetch('sports_video_game_ratings.xlsx')
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
    .then(buf => {
      const n = parseWorkbook(XLSX.read(buf, {type:'array'}));
      if(n){ poolNote = `live from sports_video_game_ratings.xlsx (${n} players)`; if(!S) render(); }
    })
    .catch(()=>{});
})();

render();
</script>
